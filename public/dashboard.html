<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Alumni Connect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
</head>
<body class="bg-black text-white font-sans min-h-screen">
    Navbar
    <header class="fixed top-6 left-1/2 transform -translate-x-1/2 z-20 flex flex-col items-center pl-6 pr-6 py-3 backdrop-blur-sm rounded-full border border-gray-600 bg-gray-900/50 w-auto">
        <div class="flex items-center justify-between w-full gap-x-8">
            <div class="flex items-center">
                <div class="relative w-5 h-5 flex items-center justify-center">
                    <span class="absolute w-1.5 h-1.5 rounded-full bg-gray-200 top-0 left-1/2 transform -translate-x-1/2 opacity-80"></span>
                    <span class="absolute w-1.5 h-1.5 rounded-full bg-gray-200 left-0 top-1/2 transform -translate-y-1/2 opacity-80"></span>
                    <span class="absolute w-1.5 h-1.5 rounded-full bg-gray-200 right-0 top-1/2 transform -translate-y-1/2 opacity-80"></span>
                    <span class="absolute w-1.5 h-1.5 rounded-full bg-gray-200 bottom-0 left-1/2 transform -translate-x-1/2 opacity-80"></span>
                </div>
            </div>

            <nav class="flex items-center space-x-6 text-sm">
                <button class="group relative inline-block overflow-hidden h-5 px-2 text-sm cursor-pointer" onclick="window.open('/dashboard.html', '_blank')">
                    <div class="flex flex-col transition-transform duration-300 ease-out group-hover:-translate-y-5">
                        <span class="text-gray-300 block h-5 leading-5">Manifesto</span>
                        <span class="text-white block h-5 leading-5">Manifesto</span>
                    </div>
                </button>
                <button class="group relative inline-block overflow-hidden h-5 px-2 text-sm cursor-pointer" onclick="window.open('/dashboard.html', '_blank')">
                    <div class="flex flex-col transition-transform duration-300 ease-out group-hover:-translate-y-5">
                        <span class="text-gray-300 block h-5 leading-5">Careers</span>
                        <span class="text-white block h-5 leading-5">Careers</span>
                    </div>
                </button>
                <button class="group relative inline-block overflow-hidden h-5 px-2 text-sm cursor-pointer" onclick="window.open('/dashboard.html', '_blank')">
                    <div class="flex flex-col transition-transform duration-300 ease-out group-hover:-translate-y-5">
                        <span class="text-gray-300 block h-5 leading-5">Discover</span>
                        <span class="text-white block h-5 leading-5">Discover</span>
                    </div>
                </button>
            </nav>

            <div class="flex items-center gap-3">
                <button class="px-3 text-sm border border-gray-600 bg-gray-800/60 text-gray-300 rounded-full hover:border-white/50 hover:text-white transition-colors duration-200">
                    LogIn
                </button>
                <div class="relative group">
                    <div class="absolute inset-0 -m-2 rounded-full bg-gray-100 opacity-40 filter blur-lg pointer-events-none transition-all duration-300 ease-out group-hover:opacity-60 group-hover:blur-xl group-hover:-m-3"></div>
                    <button class="relative z-10 px-3 text-sm font-semibold text-black bg-gradient-to-br from-gray-100 to-gray-300 rounded-full hover:from-gray-200 hover:to-gray-400 transition-all duration-200">
                        Signup
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Dashboard Content -->
    <main class="relative z-20 flex flex-col items-center justify-center h-screen text-center px-4 pt-24">
        <h1 class="text-4xl md:text-6xl font-bold text-white mb-8">
            Welcome to Dashboard
        </h1>
        <p class="text-lg md:text-xl text-gray-300 max-w-2xl mb-8">
            This is your alumni connect dashboard. Here you can manage your connections and explore opportunities.
        </p>
        <div class="flex gap-4">
            <button class="px-6 py-3 bg-white text-black rounded-lg font-semibold hover:bg-gray-200 transition-colors">
                Explore Alumni
            </button>
            <button class="px-6 py-3 border border-white text-white rounded-lg font-semibold hover:bg-white hover:text-black transition-colors">
                My Network
            </button>
        </div>
    </main>
</body>
</html>
